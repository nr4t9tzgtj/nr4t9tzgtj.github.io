<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#1F3350; --card:#F4F5F2; --ink:#1E2A38; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif; }
main{ max-width:480px; margin:0 auto; padding:28px 18px; display:grid; gap:16px; }
h1{ color:#fff; font-size:22px; margin:0 0 4px; }
a.app{ display:flex; align-items:center; gap:16px; padding:14px; border-radius:18px; background:var(--card);
  color:var(--ink); text-decoration:none; box-shadow:0 4px 0 rgba(0,0,0,.25); }
a.app:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
a.app img{ width:72px; height:72px; border-radius:16px; flex:none; }
a.app b{ font-size:20px; display:block; }
a.app span{ font-size:13px; opacity:.7; }
p.note{ color:#C9D3E0; font-size:13px; line-height:1.6; margin:8px 2px 0; }
</style>
</head>
<body>
<main>
  <h1>アプリ</h1>
  <a class="app" href="./elevator/"><img src="./elevator/icon-192.png" alt=""><div><b>かんたんエレベーター</b><span>大きいドアと丸いボタン</span></div></a>
  <a class="app" href="./elevator-real/"><img src="./elevator-real/icon-192.png" alt=""><div><b>リアルエレベーター</b><span>本物みたいな操作盤と景色</span></div></a>
  <a class="app" href="./blockfall/"><img src="./blockfall/icon-192.png" alt=""><div><b>BLOCK FALL</b><span>落ちものパズル（大人用）</span></div></a>
  <p class="note">ホーム画面に置くときは、アプリを開いてから「共有 → ホーム画面に追加」してね。</p>
</main>
</body>
</html>
