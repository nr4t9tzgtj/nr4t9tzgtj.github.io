<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="エレベーター">
<title>エレベーター</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#243B5E">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --hall:#243B5E; --ink:#1E2A38;
  --plate:#D3D9DF; --plate-edge:#A9B3BC;
  --amber:#FFA826; --lit:#FF9A1F;
  --front:#ECEBE6; --side:#D6D6D1;
  --b:48px; --wallw:18px; --ceil:16px; --fl:66px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --hall:#16263F; --front:#DCDBD5; --side:#C4C4BE; }
}
:root[data-theme="dark"]{ --hall:#16263F; --front:#DCDBD5; --side:#C4C4BE; }
*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  height:100%; margin:0; background:var(--hall); color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; overflow:hidden;
}
button{ font-family:inherit; }
.app{ height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:8px; padding:8px 10px 10px; }

/* 上のボタン（おうちの人用） */
.topbar{ display:flex; justify-content:flex-end; gap:10px; }
.snd,.mbtn{
  position:relative; width:48px; height:48px; border-radius:50%; padding:0; cursor:pointer;
  border:3px solid var(--plate-edge); background:var(--plate); color:var(--ink); font-size:22px;
}
.mbtn.active{ border-color:var(--lit); box-shadow:0 0 14px rgba(255,154,31,.9); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 50%{ transform:scale(1.08); } }
.mbtn .target{ font-weight:800; font-size:20px; color:#C46A00; }
.mbtn .badge{
  position:absolute; top:-6px; right:-6px; min-width:24px; height:24px; padding:0 5px; border-radius:12px;
  background:#E8453C; color:#fff; font-weight:800; font-size:13px; line-height:24px;
}

/* かご（エレベーターの中） */
.car{
  position:relative; flex:1; min-height:0; border-radius:10px; overflow:hidden; background:var(--front);
  display:grid; grid-template-columns:var(--wallw) minmax(0,1fr) var(--wallw);
  grid-template-rows:var(--ceil) minmax(0,1fr) var(--fl);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
.car.moving{ animation:rumble .22s linear infinite; }
@keyframes rumble{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(1.5px); } }
.ceiling{
  grid-column:1/-1; grid-row:1; position:relative; z-index:2;
  background:linear-gradient(#FFFFFF,#E4E4E0);
  clip-path:polygon(0 0,100% 0,calc(100% - var(--wallw)) 100%,var(--wallw) 100%);
}
.lamp{ position:absolute; left:28%; right:28%; top:4px; height:6px; border-radius:3px; background:#FFFBEA; box-shadow:0 0 12px 5px rgba(255,248,215,.95); }
.wall{ grid-row:1/-1; position:relative; z-index:3; }
.wall.l{ grid-column:1; background:linear-gradient(90deg,#BDBDB8,var(--side));
  clip-path:polygon(0 0,100% var(--ceil),100% calc(100% - var(--fl)),0 100%); }
.wall.r{ grid-column:3; background:linear-gradient(270deg,#BDBDB8,var(--side));
  clip-path:polygon(0 var(--ceil),100% 0,100% 100%,0 calc(100% - var(--fl))); }
.rail{ position:absolute; left:0; right:0; top:60%; height:7px; border-radius:3px; background:linear-gradient(#FAFBFC,#8E98A3); }
.front{
  grid-column:2; grid-row:2; min-height:0; min-width:0; display:flex; gap:8px; padding:8px 6px 0;
  background:linear-gradient(90deg, rgba(0,0,0,.05), rgba(0,0,0,0) 12%, rgba(0,0,0,0) 88%, rgba(0,0,0,.05)), var(--front);
}
/* ドアまわり */
.jamb{
  flex:1; min-width:0; display:flex; flex-direction:column;
  padding:6px 6px 0; border-radius:3px 3px 0 0;
  background:linear-gradient(90deg,#A7B0B8,#DDE2E6 50%,#A7B0B8);
}
.opening{ position:relative; flex:1; min-height:0; overflow:hidden; background:#2A2D33; cursor:pointer; }
.sill{ height:9px; margin:0 -6px; background:repeating-linear-gradient(90deg,#C3CAD1 0 3px,#8D96A0 3px 5px); border-top:1px solid #6F7881; }
/* ホール（ドアの外） */
.scene{ position:absolute; inset:0; }
.scene svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.sign{
  position:absolute; top:5%; left:50%; transform:translateX(-50%); z-index:1;
  display:flex; align-items:baseline; gap:6px; white-space:nowrap;
  background:#FFFFFF; border:2px solid #2B3440; border-radius:6px; padding:3px 10px 4px;
  box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.sign b{ font-size:20px; line-height:1; }
.sign span{ font-size:13px; line-height:1; }
.actor{ position:absolute; left:0; right:0; bottom:5%; z-index:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
.animal{ font-size:80px; line-height:1.1; cursor:pointer; filter:drop-shadow(0 6px 0 rgba(0,0,0,.18)); }
.animal.float{ animation:float 2.4s ease-in-out infinite; }
@keyframes float{ 0%,100%{ transform:translateY(0) rotate(-4deg); } 50%{ transform:translateY(-14%) rotate(4deg); } }
.animal.hop{ animation:hop .5s ease-out; }
@keyframes hop{ 0%{ transform:translateY(0) scale(1); } 35%{ transform:translateY(-22%) scale(1.08,.94); } 70%{ transform:translateY(0) scale(.96,1.05); } 100%{ transform:none; } }
.animal.gone{ visibility:hidden; }
.names{ display:flex; gap:8px; margin-top:12px; }
.nm{
  cursor:pointer; background:#FFFFFF; border:2px solid #2B3440; border-radius:14px; padding:4px 12px 5px;
  font-weight:800; font-size:17px; line-height:1.1; color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.28);
}
.nm.en{ font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif; font-weight:700; color:#2458B8; }
.nm:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.28); }
.nm.talk{ background:#FFF4D6; border-color:#E07400; }
.boarded{ display:none; margin-top:12px; font-size:15px; background:rgba(255,255,255,.92); border-radius:12px; padding:3px 12px; }
.actor.away .names{ display:none; }
.actor.away .boarded{ display:block; }
/* 走行中にまどから見えるシャフト */
.hoist{
  position:absolute; inset:0; z-index:1; display:none;
  background:repeating-linear-gradient(180deg,#2B2F36 0 92px,#747B85 92px 100px,#3B4048 100px 106px,#2B2F36 106px 160px);
  background-size:100% 160px;
}
.hoist.show{ display:block; }
.hoist.up{ animation:hoist var(--sp,1s) linear infinite; }
.hoist.down{ animation:hoist var(--sp,1s) linear infinite reverse; }
@keyframes hoist{ from{ background-position:0 0; } to{ background-position:0 160px; } }
/* とびら（まど付き） */
.door{ position:absolute; top:0; bottom:0; width:50%; z-index:2; transition:transform 1.1s cubic-bezier(.45,.05,.35,1); }
.door.l{ left:0; } .door.r{ right:0; }
.opening.open .door.l{ transform:translateX(-100%); }
.opening.open .door.r{ transform:translateX(100%); }
.face{
  position:absolute; inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(110,62,18,.07) 0 2px, rgba(0,0,0,0) 2px 6px, rgba(110,62,18,.04) 6px 7px, rgba(0,0,0,0) 7px 11px),
    linear-gradient(90deg,#D3A15E,#E2B676 50%,#D3A15E);
  -webkit-mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);
  -webkit-mask-size:100% 100%,50% 46%;
  -webkit-mask-position:0 0,50% 25.93%;
  -webkit-mask-repeat:no-repeat;
  -webkit-mask-composite:xor;
  mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);
  mask-size:100% 100%,50% 46%;
  mask-position:0 0,50% 25.93%;
  mask-repeat:no-repeat;
  mask-composite:exclude;
}
.door.l .face{ box-shadow:inset -1px 0 0 rgba(0,0,0,.35), inset 3px 0 6px rgba(0,0,0,.12); }
.door.r .face{ box-shadow:inset 1px 0 0 rgba(0,0,0,.35), inset -3px 0 6px rgba(0,0,0,.12); }
.glass{
  position:absolute; left:25%; width:50%; top:14%; height:46%;
  border:3px solid #9AA2AA; border-radius:2px;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.28) 0 1px, rgba(0,0,0,0) 1px 9px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 1px, rgba(0,0,0,0) 1px 9px),
    linear-gradient(135deg, rgba(255,255,255,.22), rgba(40,55,75,.18) 45%, rgba(40,55,75,.25));
  box-shadow:inset 0 0 6px rgba(0,0,0,.35);
}
/* そうさばん */
.panel{
  flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:8px; border-radius:4px 4px 0 0;
  background:repeating-linear-gradient(90deg,#CDD3D9 0 1px,#BFC6CD 1px 3px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.led{
  width:100%; height:calc(var(--b) * .95); background:#141414; border-radius:4px; border:2px solid #8E98A3;
  display:flex; align-items:center; justify-content:center; gap:2px;
  font-family:"DotGothic16","Courier New",monospace; color:var(--amber); text-shadow:0 0 8px rgba(255,168,38,.75);
}
.led .arrow{ font-size:calc(var(--b) * .36); width:calc(var(--b) * .38); text-align:center; }
.led .num{ font-size:calc(var(--b) * .62); line-height:1; }
.led .arrow.blink{ animation:blink .8s steps(2,start) infinite; }
@keyframes blink{ to{ visibility:hidden; } }
.led.full{ color:#FF4A3D; text-shadow:0 0 10px rgba(255,74,61,.85); }
.led.full .arrow{ display:none; }
.led.full .num{ font-size:calc(var(--b) * .5); animation:blink .5s steps(2,start) infinite; }
.floors,.dir{ display:grid; grid-template-columns:repeat(2,var(--b)); gap:6px; }
.dir{ margin-top:4px; }
.btn{
  width:var(--b); height:var(--b); padding:0; cursor:pointer; border-radius:6px;
  border:2px solid #8C96A0;
  background:linear-gradient(145deg,#F7F8F9,#D2D8DD 60%,#C3CAD0);
  box-shadow:inset 0 1px 0 #fff, 0 2px 0 #6F7881;
  color:#2A3440; font-weight:800; font-size:calc(var(--b) * .42); line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:transform .08s, box-shadow .2s, border-color .2s, color .2s;
}
.btn svg{ width:72%; height:auto; }
.btn:active{ transform:translateY(2px); box-shadow:inset 0 1px 0 #fff, 0 0 0 #6F7881; }
.btn.lit{
  border-color:var(--lit); color:#E07400;
  box-shadow:0 0 0 2px rgba(255,154,31,.55), 0 0 12px rgba(255,154,31,.9), inset 0 0 8px rgba(255,154,31,.4), 0 2px 0 #6F7881;
}
.btn:focus-visible,.snd:focus-visible,.mbtn:focus-visible,.start:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
/* ゆか */
.cfloor{
  grid-column:1/-1; grid-row:3; z-index:1;
  background:
    linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,0) 45%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 24px),
    #86827B;
  clip-path:polygon(var(--wallw) 0,calc(100% - var(--wallw)) 0,100% 100%,0 100%);
}
.riders{
  grid-column:1/-1; grid-row:3; z-index:4; align-self:end;
  display:flex; justify-content:center; align-items:flex-end; gap:4px; padding:0 20px 9px; pointer-events:none;
}
.rider{
  position:relative; pointer-events:auto; background:none; border:0; padding:0 2px; cursor:pointer;
  font-size:clamp(38px,11.5vw,56px); line-height:1.05;
}
.rider .bd{ display:inline-block; }
.rider::after{ content:""; position:absolute; left:16%; right:16%; bottom:-3px; height:8px; z-index:-1; background:rgba(0,0,0,.3); border-radius:50%; }
.rider.float::after{ left:30%; right:30%; opacity:.5; }
.rider.float .bd{ animation:float 2.4s ease-in-out infinite; }
.rider.hop .bd{ animation:hop .5s ease-out; }
.rider.in .bd{ animation:riderIn .4s ease-out; }
@keyframes riderIn{ 0%{ transform:translateY(-60%) scale(1.4); opacity:0; } 100%{ transform:none; opacity:1; } }
.riders.shake .rider{ animation:shake .15s linear 6; }
@keyframes shake{ 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
/* はなまる */
.hana{ position:absolute; inset:0; z-index:6; display:none; align-items:center; justify-content:center; pointer-events:none; }
.hana.show{ display:flex; }
.hana-box{ position:relative; width:78%; aspect-ratio:1; }
.hana-box svg{ width:100%; height:100%; display:block; }
.hana .bg{ fill:rgba(255,255,255,.92); }
.hana .ring{ fill:none; stroke:#E8453C; stroke-width:11; stroke-linecap:round;
  stroke-dasharray:503; stroke-dashoffset:503; animation:draw .7s ease-out forwards; transform:rotate(-90deg); transform-origin:100px 100px; }
.hana .ring.r2{ stroke-dasharray:365; stroke-dashoffset:365; animation-delay:.35s; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
.hana-txt{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:clamp(18px,6vw,28px); color:#E8453C; }
.petal{ position:absolute; font-size:clamp(22px,7vw,36px); transform:translate(-50%,-50%) scale(0); animation:pop .5s ease-out forwards; }
@keyframes pop{ 0%{ transform:translate(-50%,-50%) scale(0); } 70%{ transform:translate(-50%,-50%) scale(1.3); } 100%{ transform:translate(-50%,-50%) scale(1); } }
/* スタート画面 */
.cover{ position:fixed; inset:0; z-index:10; background:var(--hall); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; }
.cover.hide{ display:none; }
.cover .icon{ font-size:110px; line-height:1; }
.start{
  font-weight:800; font-size:28px; line-height:1; color:#C46A00; cursor:pointer;
  background:linear-gradient(145deg,#F7F8F9,#D2D8DD); border:4px solid var(--lit); border-radius:10px; padding:22px 38px;
  box-shadow:0 0 22px rgba(255,154,31,.8),0 4px 0 #6F7881;
}
.start:active{ transform:translateY(3px); }
@media (prefers-reduced-motion: reduce){
  .door{ transition-duration:.4s; } .car.moving,.hoist.up,.hoist.down{ animation:none; }
  .animal.hop,.animal.float,.rider,.rider .bd{ animation:none !important; }
  .hana .ring{ animation:none; stroke-dashoffset:0; } .petal{ animation:none; transform:translate(-50%,-50%); }
}
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="icon" aria-hidden="true">🛗</div>
  <button class="start" id="startBtn">タッチしてスタート</button>
</div>

<div class="app">
  <div class="topbar">
    <button class="mbtn" id="missionBtn" aria-label="おつかいミッション">🎯</button>
    <button class="snd" id="snd" aria-label="おと オン・オフ">🔊</button>
  </div>

  <div class="car" id="frame">
    <div class="ceiling"><span class="lamp"></span></div>
    <div class="wall l"><span class="rail"></span></div>
    <div class="wall r"><span class="rail"></span></div>

    <div class="front" id="front">
      <div class="jamb">
        <div class="opening" id="shaft" aria-label="ドア">
          <div class="scene" id="scene">
            <svg id="sceneSvg" viewBox="0 0 200 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
            <div class="sign" id="sign"></div>
            <div class="actor"><div class="animal" id="animal"></div><div class="names" id="names"><button class="nm ja" id="nameJa"></button><button class="nm en" id="nameEn"></button></div><div class="boarded" id="boarded">のったよ！</div></div>
          </div>
          <div class="hoist" id="hoist"></div>
          <div class="door l"><div class="face"></div><div class="glass"></div></div>
          <div class="door r"><div class="face"></div><div class="glass"></div></div>
          <div class="hana" id="hana" aria-hidden="true">
            <div class="hana-box" id="hanaBox">
              <svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="92"/><circle class="ring" cx="100" cy="100" r="80"/><circle class="ring r2" cx="100" cy="100" r="58"/></svg>
              <div class="hana-txt">せいかい！</div>
            </div>
          </div>
        </div>
        <div class="sill"></div>
      </div>

      <div class="panel">
        <div class="led" aria-live="polite"><span class="arrow" id="arrow"></span><span class="num" id="num">1</span></div>
        <div class="floors" id="floors"></div>
        <div class="dir">
          <button class="btn" id="openBtn" aria-label="ドアをあける">
            <svg viewBox="0 0 64 32" aria-hidden="true"><path d="M4 16 20 4v24zM60 16 44 4v24z" fill="currentColor"/><rect x="30" y="2" width="4" height="28" rx="1" fill="currentColor"/></svg>
          </button>
          <button class="btn" id="closeBtn" aria-label="ドアをしめる">
            <svg viewBox="0 0 64 32" aria-hidden="true"><path d="M26 16 10 4v24zM38 16 54 4v24z" fill="currentColor"/><rect x="30" y="2" width="4" height="28" rx="1" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="cfloor"></div>
    <div class="riders" id="riders"></div>
  </div>
</div>
<script>
(function(){
  // [えもじ, なまえ, えいご, なきごえ・うごきのおと, オプション]  ※ぜんぶ全身の絵
  const ANIMALS = [
    ["🐕","いぬ","Dog","わんわん！"],            ["🐈","ねこ","Cat","にゃーお"],
    ["🐘","ぞう","Elephant","ぱおーん！"],       ["🦒","きりん","Giraffe","のびーる"],
    ["🐧","ぺんぎん","Penguin","ぺたぺた"],      ["🐖","ぶた","Pig","ぶーぶー"],
    ["🐄","うし","Cow","もーもー"],              ["🐓","にわとり","Rooster","こけこっこー！"],
    ["🐒","さる","Monkey","うっきっき"],          ["🐇","うさぎ","Rabbit","ぴょんぴょん"],
    ["🐁","ねずみ","Mouse","ちゅーちゅー"],       ["🐅","とら","Tiger","がるるる"],
    ["🐎","うま","Horse","ひひーん！"],           ["🐑","ひつじ","Sheep","めえめえ"],
    ["🦆","かも","Duck","があがあ"],              ["🐙","たこ","Octopus","にょろにょろ"],
    ["🐳","くじら","Whale","ざぶーん！"],         ["🦖","きょうりゅう","Dinosaur","がおおおー！"],
    ["🐢","かめ","Turtle","のそのそ"],            ["🦉","ふくろう","Owl","ほーほー"],
    ["🦓","しまうま","Zebra","ぱっかぱっか"],     ["🐊","わに","Crocodile","ぱっくん！"],
    ["🦘","かんがるー","Kangaroo","ぴょーん！"],  ["🦛","かば","Hippo","がばー！"],
    ["🐿️","りす","Squirrel","かりかり"],          ["🦔","はりねずみ","Hedgehog","ちくちく"],
    ["🐬","いるか","Dolphin","きゅいきゅい"],     ["🦩","ふらみんご","Flamingo","ばさばさ"],
    ["🐫","らくだ","Camel","のっしのっし"],       ["🦜","おうむ","Parrot","こんにちは！"],
    ["👻","おばけ","Ghost","ばあ！",{float:true}]
  ];
  const ORD = ["","First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth","Ninth","Tenth",
               "Eleventh","Twelfth","Thirteenth","Fourteenth","Fifteenth"];
  // 下の階から順番：[けしき, なまえ]
  const PLACES = [
    ["parking","ちゅうしゃじょう"], ["subway","ちかてつ"],
    ["town","まち"], ["park","こうえん"], ["forest","もり"], ["sea","うみ"], ["mountain","やま"],
    ["flowers","おはなばたけ"], ["haunted","おばけやしき"], ["snow","ゆきぐに"], ["underwater","うみのなか"],
    ["nighttown","よるのまち"], ["rainbow","にじのおか"], ["balloon","ききゅうのそら"], ["clouds","くものうえ"],
    ["stars","ほしぞら"], ["space","うちゅう"], ["rooftop","おくじょう"]
  ];
  const LEVELS = [
    { label:"B2", short:"ちか2かい", en:"Basement two." },
    { label:"B1", short:"ちか1かい", en:"Basement one." }
  ];
  for(let n=1; n<=15; n++) LEVELS.push({ label:String(n), short:n+"かい", en:ORD[n]+" floor." });
  LEVELS.push({ label:"R", short:"おくじょう", en:"Rooftop." });
  LEVELS.forEach((lv,i)=>{
    lv.scene=PLACES[i][0]; lv.place=PLACES[i][1];
    const roof = lv.label==="R";

    rooftop:()=>{ let s=skyG("#7DC6F1","#E6F6FD")+sun(160,40)+cloud(15,50)+cloud(100,85,.8);
      [[0,26,55],[24,20,80],[42,30,45],[70,22,70],[94,28,50],[120,20,85],[138,30,60],[166,34,48]].forEach(b=>s+=R(b[0],230-b[2],b[1],b[2],"#B9CCE0"));
      s+=R(0,226,200,74,"#C4C8CC")+`<g stroke="#B0B5BA" stroke-width="1">${[250,272,294].map(y=>`<line x1="0" y1="${y}" x2="200" y2="${y}"/>`).join("")}</g>`;
      let bars=""; for(let x=4;x<200;x+=12) bars+=`<line x1="${x}" y1="186" x2="${x}" y2="228"/>`;
      s+=`<g stroke="#4F6B7D" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="186" x2="200" y2="186"/><line x1="0" y1="207" x2="200" y2="207"/>${bars}</g>`;
      return s; },
    subway:()=>{ let s=R(0,0,200,300,"#E9E4D8"); let g="";
      for(let y=12;y<100;y+=12) g+=`<line x1="0" y1="${y}" x2="200" y2="${y}"/>`;
      for(let x=12;x<200;x+=12) g+=`<line x1="${x}" y1="0" x2="${x}" y2="92"/>`;
      s+=`<g stroke="#D6D0C2" stroke-width="1">${g}</g>`;
      s+=R(40,20,120,32,"#fff",'rx="4" stroke="#2E6FD8" stroke-width="3"')+R(42,44,116,6,"#2E9E5B")
        +`<text x="100" y="40" text-anchor="middle" font-size="14" font-weight="800" fill="#1E2A38" font-family="M PLUS Rounded 1c, sans-serif">ちかてつえき</text>`;
      s+=R(0,92,200,120,"#3A3A40")
        +R(-10,100,220,108,"#F4F6F8",'rx="10"')+R(-10,100,220,6,"#C9CFD5")+R(-10,170,220,10,"#2E9E5B");
      [4,44,128,168].forEach(x=>s+=R(x,114,28,34,"#2B3E5A",'rx="3"'));
      s+=R(80,110,40,94,"#E1E5E9",'stroke="#9AA3AC"')+R(86,118,12,30,"#2B3E5A")+R(102,118,12,30,"#2B3E5A");
      s+=R(0,212,200,88,"#C9C2B4")+R(0,214,200,7,"#FFD23F")+`<line x1="0" y1="217.5" x2="200" y2="217.5" stroke="#E0B020" stroke-width="2" stroke-dasharray="2 4"/>`;
      return s; },
    parking:()=>{ let s=R(0,0,200,300,"#B8BCC0")+R(0,0,200,40,"#9CA1A6")
      +R(20,12,40,5,"#FFFBEA")+R(120,12,40,5,"#FFFBEA")+R(15,9,50,11,"#FFFBEA",'opacity=".3"')+R(115,9,50,11,"#FFFBEA",'opacity=".3"')
      +R(8,40,24,200,"#D2D5D8")+R(8,205,24,35,"#FFD23F");
      s+=`<g stroke="#222" stroke-width="4">${[212,224,236].map(y=>`<line x1="8" y1="${y}" x2="32" y2="${y-10}"/>`).join("")}</g>`;
      s+=C(150,72,18,"#2E6FD8")+`<text x="150" y="80" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" font-family="M PLUS Rounded 1c, sans-serif">P</text>`;
      s+=R(0,200,200,100,"#7F858B")+`<g stroke="#fff" stroke-width="3"><line x1="58" y1="300" x2="72" y2="202"/><line x1="140" y1="300" x2="130" y2="202"/></g>`;
      s+=car(78,168,"#E8453C",1.1)+car(150,172,"#4D96FF",1.05)+car(-20,176,"#FFD23F",1);
      return s; }
  };
  // ---- サウンド ----
  let ac=null, hum=null;
  function ctx(){
    if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ac.state==="suspended"){ try{ ac.resume(); }catch(e){} }
    return ac;
  }
  // 最初のタップで効果音を使えるようにする
  function unlockAudio(){
    const a=ctx();
    if(a){
      try{ const b=a.createBuffer(1,1,22050), src=a.createBufferSource(); src.buffer=b; src.connect(a.destination); src.start(0); }catch(e){}
    }
  }
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && ac) ctx(); });

  function tone(freq, at, dur, type, vol){
    const a=ctx(); if(!a||!soundOn) return;
    const t=a.currentTime+at, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
  }
  const beep = () => tone(1320,0,0.09,"square",0.05);
  const tick = () => tone(900,0,0.05,"sine",0.06);
  // 上りで着いたら「ポーン」1回、下りなら「ポン、ポーン」2回（本物と同じ）
  const buzzer = () => {
    const a=ctx(); if(!a||!soundOn) return;
    const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
    o.type="square"; o.frequency.value=210;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.02);
    g.gain.setValueAtTime(0.09,t+1.1); g.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+1.3);
  };
  const fanfare = () => {
    [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.14,0.3,"triangle",0.22));
    tone(1046.5,0.42,1.2,"triangle",0.25);
  };
  const ding = dir => {
    if(dir<0){ tone(1318.5,0,0.9,"sine",0.25); tone(1046.5,0.35,1.6,"sine",0.25); }
    else     { tone(1318.5,0,1.8,"sine",0.28); }
  };
  function whoosh(){
    const a=ctx(); if(!a||!soundOn) return;
    const len=Math.floor(a.sampleRate*1.1), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const s=a.createBufferSource(); s.buffer=buf;
    const f=a.createBiquadFilter(); f.type="bandpass"; f.Q.value=0.8;
    const g=a.createGain(), t=a.currentTime;
    f.frequency.setValueAtTime(400,t); f.frequency.linearRampToValueAtTime(1200,t+0.5); f.frequency.linearRampToValueAtTime(500,t+1.1);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.2); g.gain.linearRampToValueAtTime(0.0001,t+1.1);
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }
  function humStart(){
    const a=ctx(); if(!a||!soundOn||hum) return;
    const o=a.createOscillator(), f=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime;
    o.type="sawtooth"; o.frequency.value=62; f.type="lowpass"; f.frequency.value=180;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.05,t+0.4);
    o.connect(f).connect(g).connect(a.destination); o.start(); hum={o,g};
  }
  function humStop(){
    if(!hum||!ac) return;
    const t=ac.currentTime;
    hum.g.gain.cancelScheduledValues(t); hum.g.gain.setValueAtTime(hum.g.gain.value,t);
    hum.g.gain.linearRampToValueAtTime(0,t+0.3); hum.o.stop(t+0.35); hum=null;
  }

  // ---- アナウンス（日本語 → 英語） ----
  const hasTTS = "speechSynthesis" in window;
  let sayTimer=null;
  function utter(text, lang){
    const u=new SpeechSynthesisUtterance(text);
    u.lang = lang==="en" ? "en-US" : "ja-JP";
    u.rate = lang==="en" ? 0.9 : 0.95; u.pitch = 1.15;
    return u;
  }
  // ひとつの言葉だけよむ（なまえタッチ用）
  function sayOne(text, lang){
    if(!soundOn||!hasTTS) return;
    const go=()=>{ try{ speechSynthesis.resume(); speechSynthesis.speak(utter(text,lang)); }catch(e){} };
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    clearTimeout(sayTimer);
    if(busy){ try{ speechSynthesis.cancel(); }catch(e){} sayTimer=setTimeout(go,120); } else go();
  }
  // queue=true のときは前のアナウンスを最後まで言ってから続ける
  function say(ja, en, queue){
    if(!soundOn||!hasTTS) return;
    const go=()=>{
      try{
        speechSynthesis.resume();
        speechSynthesis.speak(utter(ja,"ja"));
        if(en) speechSynthesis.speak(utter(en,"en"));
      }catch(e){}
    };
    clearTimeout(sayTimer);
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    if(!queue && busy){
      try{ speechSynthesis.cancel(); }catch(e){}
      sayTimer=setTimeout(go, 120);
    }else{
      go();
    }
  }

  // ---- 表示 ----
  // ひみつの手順：9 → 6 → 2 の順に止まると、かならずおばけが出る
  const SECRET=["9","6","2"], GHOST=ANIMALS.findIndex(x=>x[0]==="👻");
  let stops=[];
  function setHall(i, forceGhost){
    const lv=LEVELS[i];
    svgEl.innerHTML=SCENES[lv.scene]();
    signEl.innerHTML="<b>"+lv.signNo+"</b><span>"+lv.place+"</span>";
    let a;
    if(forceGhost) a=GHOST;
    else do{ a=Math.floor(Math.random()*ANIMALS.length); }while(a===lastAnimal && ANIMALS.length>1);
    lastAnimal=a; animal=ANIMALS[a];
    const opt=animal[4]||{};
    animalEl.classList.toggle("float", !!opt.float);
    animalEl.textContent=animal[0];
    nameJa.textContent=animal[1]; nameEn.textContent=animal[2];
    nameJa.setAttribute("aria-label", animal[1]+" をよむ"); nameEn.setAttribute("aria-label", animal[2]+" をよむ");
    animalEl.classList.remove("gone"); actorEl.classList.remove("away"); sceneHas=true;
  }

  // ---- のっているみんな ----
  const ridersEl=$("riders");
  function renderRiders(newIdx){
    ridersEl.innerHTML="";
    riders.forEach((r,i)=>{
      const b=document.createElement("button");
      b.className="rider"+((r[4]&&r[4].float)?" float":"")+(i===newIdx?" in":"");
      b.innerHTML='<span class="bd">'+r[0]+'</span>'; b.setAttribute("aria-label", r[1]);
      b.addEventListener("animationend", e=>{ if(e.animationName==="hop"||e.animationName==="riderIn") b.classList.remove("hop","in"); });
      b.addEventListener("click", e=>{ e.stopPropagation(); tapRider(i,b); });
      ridersEl.appendChild(b);
    });
  }
  function tapRider(i, el){
    const r=riders[i]; if(!r) return;
    if(doorState==="open"||doorState==="opening"){
      beep(); say(r[1]+"、またね！");
      riders.splice(i,1); renderRiders();
      if(doorState==="open") scheduleAuto();
    }else{
      el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
      say(r[3]);
    }
  }
  let fullTimer=null;
  function overload(){
    buzzer();
    const led=numEl.parentElement;
    led.classList.add("full"); numEl.textContent="満員";
    ridersEl.classList.remove("shake"); void ridersEl.offsetWidth; ridersEl.classList.add("shake");
    setTimeout(()=>say("ていいん オーバーです","Overloaded."), 1200);
    clearTimeout(fullTimer);
    fullTimer=setTimeout(()=>{ led.classList.remove("full"); numEl.textContent=LEVELS[cur].label; ridersEl.classList.remove("shake"); }, 3200);
    if(doorState==="open") scheduleAuto();
  }

  // ---- おつかいミッション ----
  const missionBtn=$("missionBtn");
  function renderMission(){
    if(mission===null){
      missionBtn.innerHTML="🎯"+(stars?'<span class="badge">'+stars+'</span>':"");
      missionBtn.classList.remove("active");
    }else{
      missionBtn.innerHTML='<span class="target">'+LEVELS[mission].label+'</span>';
      missionBtn.classList.add("active");
    }
  }
  missionBtn.addEventListener("click", ()=>{
    beep();
    if(mission===null){
      let t; do{ t=Math.floor(Math.random()*LEVELS.length); }while(t===cur);
      mission=t; renderMission();
    }
    say(LEVELS[mission].go);
  });
  const hana=$("hana"), hanaBox=$("hanaBox");
  let hanaTimer=null;
  function celebrate(){
    fanfare();
    hanaBox.querySelectorAll(".petal").forEach(p=>p.remove());
    for(let k=0;k<8;k++){
      const a=k/8*Math.PI*2, p=document.createElement("span");
      p.className="petal"; p.textContent="🌸";
      p.style.left=(50+50*Math.sin(a))+"%"; p.style.top=(50-50*Math.cos(a))+"%";
      p.style.animationDelay=(0.6+k*0.06)+"s";
      hanaBox.appendChild(p);
    }
    hana.classList.remove("show"); void hana.offsetWidth; hana.classList.add("show");
    clearTimeout(hanaTimer); hanaTimer=setTimeout(()=>hana.classList.remove("show"), 3000);
  }
  function setArrow(dir){
    arrowEl.textContent = dir>0 ? "▲" : dir<0 ? "▼" : "";
    arrowEl.classList.toggle("blink", dir!==0);
  }

  // ---- ドア ----
  function scheduleAuto(){
    clearTimeout(autoTimer);
    autoTimer=setTimeout(closeDoors, queue.length ? 2600 : 8000);
  }
  function openDoors(quiet){
    if(moving) return;
    clearTimeout(autoTimer);
    if(doorState==="open"){ scheduleAuto(); return; }
    if(doorState==="opening") return;
    if(!quiet) say("ドアがひらきます","Doors opening.");
    doorState="opening"; shaft.classList.add("open"); whoosh();
    clearTimeout(doorTimer);
    doorTimer=setTimeout(()=>{ doorState="open"; scheduleAuto(); }, DOOR_MS);
  }
  function closeDoors(){
    if(doorState==="closed"||doorState==="closing") return;
    clearTimeout(autoTimer);
    say("ドアがしまります。ごちゅうい ください。","Doors closing.");
    doorState="closing"; shaft.classList.remove("open"); whoosh();
    clearTimeout(doorTimer);
    doorTimer=setTimeout(()=>{ doorState="closed"; processQueue(); }, DOOR_MS);
  }

  // ---- 移動 ----
  function arrive(dir){
    stops.push(LEVELS[cur].label); if(stops.length>SECRET.length) stops.shift();
    const secret = stops.join()===SECRET.join();
    hoist.className="hoist";
    setHall(cur, secret); ding(dir);
    const hit = mission!==null && mission===cur;
    const pending = mission;
    setTimeout(()=>{
      say(LEVELS[cur].ja, LEVELS[cur].en);
      if(hit) say("せいかい！ すごいね！", null, true);
      else if(pending!==null) say(LEVELS[pending].where, null, true);
    }, 700);
    if(hit){
      mission=null; stars++;
      try{ localStorage.setItem("elvr-stars", String(stars)); }catch(e){}
      setTimeout(()=>{ celebrate(); renderMission(); }, 1700);
    }
    setTimeout(()=>openDoors(true), 1600);
  }
  function processQueue(){
    if(moving||doorState!=="closed"||!queue.length) return;
    const target=queue[0];
    if(target===cur){ queue.shift(); unlight(target); arrive(lastDir); return; }
    moving=true;
    const dir = target>cur ? 1 : -1; lastDir=dir;
    const stepMs = Math.abs(target-cur)>=5 ? 650 : 950;
    setArrow(dir); frame.classList.add("moving"); humStart();
    // まどの外がうごきだす
    hoist.style.setProperty("--sp", (stepMs/1000*0.8)+"s");
    hoist.className="hoist show "+(dir>0?"up":"down");
    say(dir>0 ? "うえにまいります" : "したにまいります", dir>0 ? "Going up." : "Going down.", true);
    const step=()=>{
      cur+=dir; numEl.textContent=LEVELS[cur].label; tick();
      if(cur===target){
        moving=false; queue.shift(); unlight(target);
        humStop(); frame.classList.remove("moving"); setArrow(0);
        arrive(dir);
      }else{
        moveTimer=setTimeout(step, stepMs);
      }
    };
    moveTimer=setTimeout(step, 1600);
  }

  // ---- 操作 ----
  function pressFloor(f){
    beep();
    if(!moving && f===cur && !queue.length && doorState!=="closing"){ openDoors(); return; }
    if(!queue.includes(f)){ queue.push(f); light(f); }
    if(doorState==="open") scheduleAuto();
    else if(doorState==="closed") processQueue();
  }
  $("openBtn").addEventListener("click", ()=>{ beep(); openDoors(); });
  $("closeBtn").addEventListener("click", ()=>{ beep(); if(!moving) closeDoors(); });
  shaft.addEventListener("click", ()=>{ if(doorState==="closed" && !moving){ beep(); openDoors(); } });
  animalEl.addEventListener("animationend", e=>{ if(e.animationName==="hop") animalEl.classList.remove("hop"); });
  animalEl.addEventListener("click", e=>{
    if(doorState!=="open" && doorState!=="opening") return;
    e.stopPropagation();
    if(!sceneHas) return;
    if(riders.length>=CAP){
      animalEl.classList.remove("hop"); void animalEl.offsetWidth; animalEl.classList.add("hop");
      overload(); return;
    }
    // のりこむ
    say(animal[3]);
    riders.push(animal); sceneHas=false;
    animalEl.classList.add("gone"); actorEl.classList.add("away");
    renderRiders(riders.length-1);
    if(doorState==="open") scheduleAuto();
  });
  // なまえをタッチ → ひらがなは日本語、えいごは英語でよむ
  function tapName(btn, lang){
    return e=>{
      e.stopPropagation();
      if(doorState!=="open" && doorState!=="opening") return;
      sayOne(btn.textContent, lang);
      btn.classList.add("talk"); setTimeout(()=>btn.classList.remove("talk"), 700);
      if(doorState==="open") scheduleAuto();
    };
  }
  nameJa.addEventListener("click", tapName(nameJa,"ja"));
  nameEn.addEventListener("click", tapName(nameEn,"en"));
  sndBtn.addEventListener("click", ()=>{
    soundOn=!soundOn;
    sndBtn.textContent = soundOn ? "🔊" : "🔇";
    if(!soundOn){ humStop(); try{ speechSynthesis.cancel(); }catch(e){} }
    else { unlockAudio(); beep(); if(moving) humStart(); }
    try{ localStorage.setItem("elvr-sound", soundOn ? "on" : "off"); }catch(e){}
  });
  $("startBtn").addEventListener("click", ()=>{
    unlockAudio();
    beep();
    say("エレベーターに のろう！");
    $("cover").classList.add("hide");
    fit();
  });
  document.addEventListener("touchstart", ()=>{}, {passive:true});
  document.addEventListener("dblclick", e=>e.preventDefault());

  setHall(cur);
  renderMission();
  fit();
})();
</script>
<script>
if("serviceWorker" in navigator){ addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
